<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stashtronauts</title>
<meta name="description" content="Your savings goals as planets you can fly between.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="space.css">
<link rel="stylesheet" href="console.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="space" aria-label="Space view of your savings goals. Drag to look around, scroll or pinch to fly forward and back." role="img"></canvas>
<!-- A faint wash of a planet's sky colour while flying through its air (atmosphere.js). -->
<div id="skyTint" class="sky-tint" aria-hidden="true"></div>
<p id="layerLine" class="layer-line" role="status" hidden></p>

<header class="bar">
  <h1>Stashtronauts</h1>
  <span class="hud-row">
  <span id="fleetHud" class="fleet-hud">
    <button id="fleetBtn" class="hud-btn icon" aria-expanded="false" aria-controls="fleetTip" title="Emergency fund fleet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8-7.5 10-4.3-2-7.5-5.4-7.5-10V6z"/><path d="M8.5 12.5l2.4 2.3 4.6-5"/></svg><span class="sr">Emergency fund fleet</span>
    </button>
    <div id="fleetTip" class="fleet-tip" role="status"><div><p id="fleetLine"></p><button id="fleetGo" class="hud-btn small">Show the fleet</button></div></div>
  </span>
  <button id="lookCloser" class="hud-btn" aria-pressed="false">Look closer</button>
  <button id="freeCam" class="hud-btn" aria-pressed="false" title="Free camera (F)">Free camera</button>
  <button id="openConsole" class="hud-btn" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="3"/><path d="M8 20h8"/></svg>Console
  </button>
  </span>
</header>

<p id="banner" class="banner" hidden role="status">These are example planets. <button class="link" data-open="setup">Add a savings goal</button> to see your own.</p>

<p id="hello" class="banner hello" role="status" hidden></p>

<p id="toast" class="toast" role="status" hidden></p>

<!-- Shown once, on the first visit. The full list is in the console under "Ship and pilot". -->
<aside id="hint" class="hint" hidden aria-label="Controls">
  <b>Flying</b><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> fly</span><span><kbd>Space</kbd> up</span><span><kbd>C</kbd> or <kbd>Ctrl</kbd> down</span><span><kbd>Shift</kbd> boost</span><span><kbd>F</kbd> free camera</span>
</aside>

<!-- The ship console: a tablet built into the dashboard. -->
<dialog id="console" class="console" aria-labelledby="shipLabel">
  <div class="device">
    <span class="hw keys" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="hw knob" aria-hidden="true"></span>
    <span class="hw power" aria-hidden="true"></span>
    <div class="screen">
      <header class="status">
        <h2 class="ship"><span class="lamp" aria-hidden="true"></span><span id="shipLabel"></span></h2>
        <p id="worthLine" class="worth"></p>
        <button class="close" data-a="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Close <kbd>Esc</kbd></button>
      </header>
      <nav id="side" class="side" aria-label="Console sections"></nav>
      <main id="panel" class="main" tabindex="-1"></main>
    </div>
  </div>
  <p id="live" class="sr" role="status" aria-live="polite"></p>
</dialog>

<!-- Money entry and short questions open in this smaller dialog over the tablet. -->
<dialog id="pad" class="pad" aria-labelledby="padTitle"></dialog>

<script type="module" src="space.js"></script>
<script type="module" src="console.js"></script>
</body>
</html>
